version: 2

project_name: usbec

builds:
  - id: usbec
    binary: usbec
    main: .
    env:
      - CGO_ENABLED=1
    goos:
      - linux
    goarch:
      - amd64
      - '386'
      - arm
      - arm64
      - ppc64le
      - riscv64
      - s390x
    goarm:
      - '5'
      - '7'
    overrides:
      - goos: linux
        goarch: '386'
        env:
          - CC=i686-linux-gnu-gcc
          - PKG_CONFIG_LIBDIR=/usr/lib/i386-linux-gnu/pkgconfig:/usr/share/pkgconfig
      - goos: linux
        goarch: arm
        goarm: '5'
        env:
          - CC=arm-linux-gnueabi-gcc
          - PKG_CONFIG_LIBDIR=/usr/lib/arm-linux-gnueabi/pkgconfig:/usr/share/pkgconfig
      - goos: linux
        goarch: arm
        goarm: '7'
        env:
          - CC=arm-linux-gnueabihf-gcc
          - PKG_CONFIG_LIBDIR=/usr/lib/arm-linux-gnueabihf/pkgconfig:/usr/share/pkgconfig
      - goos: linux
        goarch: arm64
        env:
          - CC=aarch64-linux-gnu-gcc
          - PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
      - goos: linux
        goarch: ppc64le
        env:
          - CC=powerpc64le-linux-gnu-gcc
          - PKG_CONFIG_LIBDIR=/usr/lib/powerpc64le-linux-gnu/pkgconfig:/usr/share/pkgconfig
      - goos: linux
        goarch: riscv64
        env:
          - CC=riscv64-linux-gnu-gcc
          - PKG_CONFIG_LIBDIR=/usr/lib/riscv64-linux-gnu/pkgconfig:/usr/share/pkgconfig
      - goos: linux
        goarch: s390x
        env:
          - CC=s390x-linux-gnu-gcc
          - PKG_CONFIG_LIBDIR=/usr/lib/s390x-linux-gnu/pkgconfig:/usr/share/pkgconfig
    ldflags:
      - -s -w -X main.VERSION={{ .Version }}
    mod_timestamp: '{{ .CommitTimestamp }}'

archives:
  - id: usbec
    formats:
      - tar.gz
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}'
    files:
      - README.md
      - LICENSE
      - usbec.toml
      - hotplug/LICENSE.txt

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - Merge pull request
      - Merge branch

release:
  prerelease: auto
